<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
:root{--gold:#e8c36a;--gold2:#c9a24a;--ink:#14141a;--card:#1d1e26;--mut:#9a9aa6}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:12px 'Segoe UI',system-ui,sans-serif;color:#f1efe8;user-select:none}
#root{position:absolute;right:0;bottom:0;width:100%;height:100%}
/* a barra fica sempre colada embaixo, centrada nos 150px da direita */
#zone{position:absolute;right:0;bottom:0;width:150px;height:100%}
#glow{position:absolute;left:50%;bottom:-2px;width:60px;height:14px;margin-left:-30px;border-radius:8px;background:var(--gold2);filter:blur(7px);opacity:.22;transition:all .45s cubic-bezier(.2,.8,.2,1)}
#bar{position:absolute;left:50%;bottom:6px;width:58px;height:3px;margin-left:-29px;border-radius:2px;
  background:linear-gradient(90deg,rgba(232,195,106,0),var(--gold) 28%,#fff3c9 50%,var(--gold) 72%,rgba(232,195,106,0));
  opacity:.6;animation:pulse 2.8s ease-in-out infinite;transition:all .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pulse{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.35)}}
/* o retângulo do portal: nasce da barra quando o arquivo chega perto */
#gate{position:absolute;left:50%;bottom:9px;width:0;height:0;margin-left:0;border-radius:10px 10px 3px 3px;opacity:0;
  border:1px solid rgba(232,195,106,.75);border-bottom:none;
  background:linear-gradient(0deg,rgba(232,195,106,.28),rgba(232,195,106,.04) 70%,rgba(232,195,106,0));
  transition:all .5s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.dot{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:#fff3c9;opacity:0}
body.near #bar{width:120px;margin-left:-60px;opacity:1}
body.near #glow{width:130px;margin-left:-65px;opacity:.85;height:18px}
body.near #gate{width:70px;height:62px;margin-left:-35px;opacity:1}
body.near .dot{animation:rise 1.6s ease-in infinite}
.dot:nth-child(1){left:14%;animation-delay:0s!important}.dot:nth-child(2){left:30%;animation-delay:.35s!important}
.dot:nth-child(3){left:48%;animation-delay:.8s!important}.dot:nth-child(4){left:64%;animation-delay:.2s!important}
.dot:nth-child(5){left:80%;animation-delay:.6s!important}.dot:nth-child(6){left:40%;animation-delay:1.1s!important}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-58px);opacity:0}}
body.pop #bar{width:100px;margin-left:-50px;opacity:1}
body.pop #glow{opacity:.6}
body.pop #gate{opacity:0;height:0}
body.flash #bar{filter:brightness(2.2)}
/* o pop-up, pequeno, colado acima da barra */
#pop{position:absolute;right:8px;bottom:22px;width:250px;padding:11px 12px 10px;border-radius:12px;background:var(--card);
  border:1px solid rgba(232,195,106,.6);opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;
  transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.2,1)}
body.pop #pop{opacity:1;transform:none;pointer-events:auto}
#pn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ps{color:var(--mut);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pq{margin:8px 0 8px;font-size:12px}
.btns{display:flex;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
#yes{background:var(--gold);color:var(--ink);flex:1}
#yes:hover{background:#f3d584}
#no{background:transparent;color:#c9c9d2;border:1px solid #5a5b6a}
#no:hover{background:#2a2b35}
#fb{margin-top:8px;font-size:11px;color:var(--mut);display:none}
</style></head>
<body>
<div id="root">
  <div id="pop"><div id="pn"></div><div id="ps"></div><div id="pq">Enviar pro celular?</div>
    <div class="btns" id="btns"><button id="yes">Sim, enviar</button><button id="no">Não</button></div><div id="fb"></div></div>
  <div id="zone">
    <div id="gate"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div id="glow"></div><div id="bar"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id), B = document.body;
let pending = null, nearT = 0, popT = 0, state = 'idle';
const RANK = { idle: 0, near: 1, pop: 2 };
let sizeT = 0;
function paint(s) { B.classList.toggle('near', s === 'near'); B.classList.toggle('pop', s === 'pop'); }
// A janela só muda de tamanho nas pontas da animação: cresce ANTES de abrir e encolhe DEPOIS de fechar,
// senão o pop-up e o retângulo saem cortados no meio da transição.
function setState(s) {
  if (s === state) return;
  const grow = RANK[s] > RANK[state];
  state = s; clearTimeout(sizeT);
  if (grow) { zarpa.portalSize(s); sizeT = setTimeout(() => paint(s), 60); }
  else { paint(s); sizeT = setTimeout(() => zarpa.portalSize(s), 600); }
}
function back() { clearTimeout(popT); pending = null; setState('idle'); }
function human(n) { return n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

window.addEventListener('dragover', e => { e.preventDefault(); if (state === 'idle') setState('near'); clearTimeout(nearT); nearT = setTimeout(() => { if (state === 'near') setState('idle'); }, 350); });
window.addEventListener('dragenter', e => { e.preventDefault(); if (state === 'idle') setState('near'); });
window.addEventListener('drop', e => {
  e.preventDefault(); clearTimeout(nearT);
  const dt = e.dataTransfer, files = [...dt.files], paths = files.map(f => zarpa.pathOf(f)).filter(Boolean);
  let spec = null, name = '', sub = '';
  if (paths.length) {
    spec = { paths };
    name = files.length > 1 ? files.length + ' arquivos' : files[0].name;
    sub = files.length > 1 ? files.map(f => f.name).join(', ') : human(files[0].size);
  } else if (files.length) {
    return fail('Essa imagem veio de uma página e não tem arquivo no PC. Salve numa pasta e jogue de lá.');
  } else {
    const txt = (dt.getData('text/uri-list') || dt.getData('text/plain') || '').trim();
    if (!txt) return setState('idle');
    spec = { texts: [txt.split(/\r?\n/)[0].startsWith('#') ? txt.split(/\r?\n/).filter(l => !l.startsWith('#'))[0] : txt] };
    let host = ''; try { host = new URL(spec.texts[0]).hostname; } catch {}
    name = host || 'Texto'; sub = host ? spec.texts[0] : spec.texts[0].slice(0, 60);
  }
  pending = spec;
  $('pn').textContent = name; $('ps').textContent = sub;
  $('pq').textContent = 'Enviar pro celular?'; $('btns').style.display = 'flex'; $('fb').style.display = 'none';
  B.classList.add('flash'); setTimeout(() => B.classList.remove('flash'), 350);
  setState('pop');
  clearTimeout(popT); popT = setTimeout(back, timeoutS * 1000);   // sem resposta no tempo configurado (padrão 15 s): conta como Não
});
// tempo pra responder, vindo da aba Configurações
let timeoutS = 15;
zarpa.cfgGet().then(c => { if (c && c.timeout) timeoutS = c.timeout; }).catch(() => {});
zarpa.onCfg(c => { if (c && c.timeout) timeoutS = c.timeout; });
// "Testar portal": mostra o pop-up de exemplo. O Sim só fecha, não envia nada.
function demoPop() {
  pending = null;
  $('pn').textContent = 'relatorio.pdf'; $('ps').textContent = '2,4 MB';
  $('pq').textContent = 'Enviar pro celular? (teste)'; $('btns').style.display = 'flex'; $('fb').style.display = 'none';
  B.classList.add('flash'); setTimeout(() => B.classList.remove('flash'), 350);
  setState('pop'); clearTimeout(popT); popT = setTimeout(back, timeoutS * 1000);
}
function fail(msg) {
  $('pn').textContent = 'Não deu'; $('ps').textContent = ''; $('pq').textContent = msg; $('btns').style.display = 'none'; $('fb').style.display = 'none';
  setState('pop'); clearTimeout(popT); popT = setTimeout(back, 4500);
}
$('no').onclick = back;
$('yes').onclick = async () => {
  if (!pending) return back();
  const spec = pending; pending = null; clearTimeout(popT);
  $('btns').style.display = 'none'; $('pq').textContent = 'Enviando…';
  const r = await zarpa.outAdd(spec);
  if (r.errors && r.errors.length) { $('pq').textContent = r.errors[0]; }
  else {
    const o = await zarpa.outList();
    $('pq').textContent = 'Enviado';
    $('fb').textContent = o.online ? 'O celular vai avisar.' : 'Celular fora de alcance. Fica na fila até ele conectar.';
    $('fb').style.display = 'block';
  }
  popT = setTimeout(back, 2600);
};
</script></body></html>
